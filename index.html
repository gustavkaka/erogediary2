<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chronicle</title>

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #f0f7ff 0%, #e2f0fe 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary-grad: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      --primary: #0284c7;
      --primary-light: rgba(56, 189, 248, 0.15);
      --sky-blue: #38bdf8;
      --glass-border: rgba(255, 255, 255, 0.9);
      --shadow-app: 0 8px 32px rgba(2, 132, 199, 0.08);
      --shadow-fab: 0 8px 24px rgba(2, 132, 199, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e2f0fe;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      margin: 0 auto;
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.1);
    }

    .app-header {
      padding: 16px 16px 12px 16px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 10;
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--text-main);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 999px;
      letter-spacing: 0.05em;
    }

    .tab-bar-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .segmented-control {
      flex: 1;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px;
      background: rgba(15, 23, 42, 0.05);
      border-radius: 14px;
      scrollbar-width: none;
    }
    .segmented-control::-webkit-scrollbar {
      display: none;
    }

    .seg-tab {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .seg-tab.active {
      background: #ffffff;
      color: var(--primary);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .manage-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.05);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .manage-btn:active {
      transform: scale(0.92);
      background: var(--primary-light);
    }

    .manage-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--primary);
      stroke-width: 2.5;
      fill: none;
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 90px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: calc(44px + 14px + (100% - 58px) / 2);
      top: 14px;
      bottom: 14px;
      width: 2px;
      background: linear-gradient(180deg, var(--sky-blue) 0%, rgba(56, 189, 248, 0.2) 100%);
      border-radius: 2px;
      z-index: 0;
    }

    .timeline-item {
      display: flex;
      gap: 14px;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .date-col {
      width: 44px;
      text-align: right;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }

    .date-col.active-date {
      color: var(--primary);
      font-size: 14px;
      font-weight: 800;
    }

    .card-col {
      flex: 1;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      padding: 8px;
      box-shadow: var(--shadow-app);
      transition: transform 0.2s ease;
      overflow: hidden;
      cursor: pointer;
    }

    .card-col:active {
      transform: scale(0.98);
    }

    .other-day-node {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 24px;
    }

    .node-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--sky-blue);
      border: 2px solid #ffffff;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      pointer-events: none;
    }

    .fab-btn {
      position: absolute;
      bottom: 28px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-grad);
      color: #ffffff;
      border: none;
      box-shadow: var(--shadow-fab);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
    }

    .fab-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.5);
    }

    .fab-btn svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fab-btn:active {
      transform: scale(0.90);
    }

    /* モーダル */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid var(--glass-border);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }

    .add-title-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-title-input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(226, 232, 240, 1);
      background: var(--bg-gradient);
      font-size: 13px;
      outline: none;
      color: var(--text-main);
    }

    .add-title-btn {
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--primary-grad);
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .title-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .title-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(240, 247, 255, 0.7);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .title-item.dragging {
      opacity: 0.4;
      border: 1px dashed var(--primary);
      background: var(--primary-light);
    }

    .title-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      font-size: 16px;
      touch-action: none;
    }

    .title-item-actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: #fff;
      border: 1px solid rgba(226, 232, 240, 1);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 600;
    }

    .action-btn.delete {
      color: #ef4444;
    }

    .backup-section {
      border-top: 1px solid rgba(226, 232, 240, 1);
      padding-top: 14px;
      display: flex;
      gap: 8px;
    }

    .backup-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.05);
      border: 1px solid rgba(226, 232, 240, 1);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
    }

    .backup-btn:active {
      background: var(--primary-light);
    }

    .lightbox-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-overlay.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <header class="app-header">
      <div class="app-title">
        <span>CHRONICLE</span>
        <span class="app-title-badge">記録</span>
      </div>
      <div class="tab-bar-wrapper">
        <div class="segmented-control" id="tabContainer"></div>
        <button class="manage-btn" onclick="openModal()" title="作品一覧">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-content">
      <div class="timeline" id="timeline"></div>
    </main>

    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
    <input type="file" id="restoreInput" accept=".json" style="display: none;" onchange="handleRestoreFile(event)">

    <button class="fab-btn" id="fabBtn" onclick="triggerImageUpload()">
      <svg viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-header">
          <span class="modal-title">作品・データ管理</span>
          <button class="modal-close-btn" onclick="closeModal()">✕</button>
        </div>
        
        <div class="add-title-form">
          <input type="text" id="newTitleInput" class="add-title-input" placeholder="新しい作品名...">
          <button class="add-title-btn" onclick="addTitle()">追加</button>
        </div>

        <div class="title-list" id="modalTitleList"></div>

        <div class="backup-section">
          <button class="backup-btn" onclick="exportData()">データ書き出し</button>
          <button class="backup-btn" onclick="document.getElementById('restoreInput').click()">データ読み込み</button>
        </div>
      </div>
    </div>

    <div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
      <img id="lightboxImg" class="lightbox-img" src="" alt="拡大表示">
    </div>
  </div>

  <script>
    // Service Worker の登録
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
    }

    let titles = [];
    let posts = [];
    let activeIndex = 0; // 0: ALL

    let db = null;
    let longPressTimer = null;
    let isLongPress = false;

    initIndexedDB();

    function initIndexedDB() {
      const request = indexedDB.open("ChronicleDB", 1);

      request.onupgradeneeded = function(e) {
        db = e.target.result;
        if (!db.objectStoreNames.contains("appData")) {
          db.createObjectStore("appData");
        }
      };

      request.onsuccess = function(e) {
        db = e.target.result;
        loadDataFromDB();
      };

      request.onerror = function(e) {
        console.error("IndexedDB Open Error:", e);
      };
    }

    function loadDataFromDB() {
      const tx = db.transaction(["appData"], "readonly");
      const store = tx.objectStore("appData");

      const reqTitles = store.get("titles");
      const reqPosts = store.get("posts");

      tx.oncomplete = function() {
        const sampleImgA = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='337' viewBox='0 0 600 337'><rect width='600' height='337' fill='%2338bdf8'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-size='24' font-family='sans-serif'>Sample Screenshot A</text></svg>";
        const sampleImgB = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='337' viewBox='0 0 600 337'><rect width='600' height='337' fill='%230284c7'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-size='24' font-family='sans-serif'>Sample Screenshot B</text></svg>";

        titles = reqTitles.result || ["サンプル作品A", "サンプル作品B"];
        posts = reqPosts.result || [
          { id: 1, titleIndex: 2, date: "2026-10-01", img: sampleImgB },
          { id: 2, titleIndex: 1, date: "2026-10-05", img: sampleImgA },
          { id: 3, titleIndex: 2, date: "2026-10-08", img: sampleImgB },
          { id: 4, titleIndex: 1, date: "2026-10-12", img: sampleImgA }
        ];

        renderTabs();
        renderTimeline();
      };
    }

    function saveDataToDB() {
      if (!db) return;
      const tx = db.transaction(["appData"], "readwrite");
      const store = tx.objectStore("appData");
      store.put(titles, "titles");
      store.put(posts, "posts");
    }

    function renderTabs() {
      const container = document.getElementById('tabContainer');
      let html = `<div class="seg-tab ${activeIndex === 0 ? 'active' : ''}" onclick="selectTab(0)">ALL</div>`;
      
      titles.forEach((title, index) => {
        const tabIdx = index + 1;
        html += `<div class="seg-tab ${activeIndex === tabIdx ? 'active' : ''}" onclick="selectTab(${tabIdx})">${title}</div>`;
      });

      container.innerHTML = html;

      const fabBtn = document.getElementById('fabBtn');
      if (fabBtn) {
        if (activeIndex === 0) {
          fabBtn.classList.add('hidden');
        } else {
          fabBtn.classList.remove('hidden');
        }
      }

      renderModalList();
    }

    function selectTab(index) {
      activeIndex = index;
      renderTabs();
      renderTimeline();
    }

    function renderTimeline() {
      const timeline = document.getElementById('timeline');
      if (posts.length === 0) {
        timeline.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:40px; font-size:13px;">記録がありません</div>`;
        return;
      }

      const allSortedPosts = [...posts].sort((a, b) => new Date(a.date) - new Date(b.date));

      const currentTitlePosts = activeIndex === 0 
        ? allSortedPosts 
        : allSortedPosts.filter(p => p.titleIndex === activeIndex);

      if (currentTitlePosts.length === 0 && activeIndex !== 0) {
        timeline.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:40px; font-size:13px;">この作品の記録はまだありません</div>`;
        return;
      }

      const startDate = new Date(currentTitlePosts[0].date);
      const filteredPosts = allSortedPosts.filter(p => new Date(p.date) >= startDate);

      const dateMap = new Map();
      filteredPosts.forEach(post => {
        if (!dateMap.has(post.date)) {
          dateMap.set(post.date, []);
        }
        dateMap.get(post.date).push(post);
      });

      const uniqueDates = Array.from(dateMap.keys());
      let html = '';

      uniqueDates.forEach((dateStr, index) => {
        const datePosts = dateMap.get(dateStr);
        const currentDate = new Date(dateStr);
        const dateLabel = `${currentDate.getMonth() + 1}/${currentDate.getDate()}`;

        const hasActivePosts = activeIndex === 0 
          ? true 
          : datePosts.some(p => p.titleIndex === activeIndex);

        const targetPosts = activeIndex === 0
          ? datePosts
          : datePosts.filter(p => p.titleIndex === activeIndex);

        let gapPx = 20;
        if (index > 0) {
          const prevDate = new Date(uniqueDates[index - 1]);
          const diffDays = Math.round((currentDate - prevDate) / (1000 * 60 * 60 * 24));
          if (diffDays > 1) {
            gapPx = Math.min(20 + (diffDays - 1) * 14, 140);
          }
        }

        const marginTopStyle = index === 0 ? '' : `margin-top: ${gapPx}px;`;

        if (hasActivePosts) {
          targetPosts.forEach(post => {
            html += `
              <div class="timeline-item" style="${marginTopStyle}">
                <div class="date-col active-date">${dateLabel}</div>
                <div class="card-col" 
                     onmousedown="startLongPress(event, ${post.id})" 
                     onmouseup="cancelLongPress()" 
                     onmouseleave="cancelLongPress()" 
                     ontouchstart="startLongPress(event, ${post.id})" 
                     ontouchend="cancelLongPress()" 
                     oncontextmenu="handleContextMenu(event, ${post.id})"
                     onclick="handleCardClick(${post.id})">
                  <img src="${post.img}" class="card-img" alt="" draggable="false">
                </div>
              </div>
            `;
          });
        } else {
          html += `
            <div class="timeline-item" style="${marginTopStyle}">
              <div class="date-col">${dateLabel}</div>
              <div class="other-day-node">
                <div class="node-dot"></div>
              </div>
            </div>
          `;
        }
      });

      timeline.innerHTML = html;
    }

    function startLongPress(e, postId) {
      isLongPress = false;
      longPressTimer = setTimeout(() => {
        isLongPress = true;
        if (confirm('この記録を削除しますか？')) {
          deletePost(postId);
        }
      }, 500);
    }

    function cancelLongPress() {
      clearTimeout(longPressTimer);
    }

    function handleContextMenu(e, postId) {
      e.preventDefault();
      if (confirm('この記録を削除しますか？')) {
        deletePost(postId);
      }
    }

    function handleCardClick(postId) {
      if (isLongPress) {
        isLongPress = false;
        return;
      }
      const post = posts.find(p => p.id === postId);
      if (post && post.img) {
        openLightbox(post.img);
      }
    }

    function deletePost(postId) {
      posts = posts.filter(p => p.id !== postId);
      saveDataToDB();
      renderTimeline();
    }

    function openLightbox(imgSrc) {
      document.getElementById('lightboxImg').src = imgSrc;
      document.getElementById('lightboxOverlay').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightboxOverlay').classList.remove('active');
    }

    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function renderModalList() {
      const listContainer = document.getElementById('modalTitleList');
      let html = '';

      titles.forEach((title, index) => {
        html += `
          <div class="title-item" draggable="true" data-index="${index}">
            <div class="title-item-left">
              <span class="drag-handle">☰</span>
              <span>${title}</span>
            </div>
            <div class="title-item-actions">
              <button class="action-btn" onclick="editTitle(${index})">編集</button>
              <button class="action-btn delete" onclick="deleteTitle(${index})">削除</button>
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = html;
      setupDragAndDrop();
    }

    function setupDragAndDrop() {
      const items = document.querySelectorAll('.title-item');
      let draggedIndex = null;

      items.forEach(item => {
        item.addEventListener('dragstart', (e) => {
          draggedIndex = parseInt(item.getAttribute('data-index'));
          item.classList.add('dragging');
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
        });

        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          const targetIndex = parseInt(item.getAttribute('data-index'));
          if (draggedIndex !== null && draggedIndex !== targetIndex) {
            const movedItem = titles.splice(draggedIndex, 1)[0];
            titles.splice(targetIndex, 0, movedItem);
            draggedIndex = targetIndex;
            saveDataToDB();
            renderTabs();
          }
        });
      });
    }

    function addTitle() {
      const input = document.getElementById('newTitleInput');
      const text = input.value.trim();
      if (text) {
        titles.push(text);
        input.value = '';
        saveDataToDB();
        renderTabs();
      }
    }

    function editTitle(index) {
      const newName = prompt('作品名を変更:', titles[index]);
      if (newName && newName.trim()) {
        titles[index] = newName.trim();
        saveDataToDB();
        renderTabs();
      }
    }

    function deleteTitle(index) {
      if (confirm('この作品を削除しますか？')) {
        titles.splice(index, 1);
        if (activeIndex > titles.length) activeIndex = titles.length;
        saveDataToDB();
        renderTabs();
      }
    }

    function triggerImageUpload() {
      document.getElementById('imageInput').click();
    }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const imageUrl = e.target.result;
        const todayStr = new Date().toISOString().split('T')[0];

        const targetTitleIdx = activeIndex;

        posts.push({
          id: Date.now(),
          titleIndex: targetTitleIdx,
          date: todayStr,
          img: imageUrl
        });

        saveDataToDB();
        renderTimeline();
      };

      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function exportData() {
      const backupData = {
        titles: titles,
        posts: posts
      };
      const jsonStr = JSON.stringify(backupData);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `chronicle_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function handleRestoreFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData.titles && importedData.posts) {
            titles = importedData.titles;
            posts = importedData.posts;
            saveDataToDB();
            renderTabs();
            renderTimeline();
            alert("データを復元いたしましたわ！");
          } else {
            alert("正しいバックアップファイルではありませんわ。");
          }
        } catch (err) {
          alert("ファイルの読み込みに失敗いたしました。");
        }
      };

      reader.readAsText(file);
      event.target.value = '';
    }
  </script>

</body>
</html>
